<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>签名计算工具</title>
    <!-- CDN 依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-base64@3.7.2/base64.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      body {
        max-width: 700px;
        margin: 30px auto;
        padding: 0 4px;
        background: #f5f7fa;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #333;
        font-size: 20px;
      }
      .form-item {
        margin: 10px 0;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
        color: #555;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }
      /* 紧凑自适应样式 */
      .info-box {
        padding: 8px 10px;
        background: #f8f9fa;
        border-radius: 5px;
        margin: 8px 0;
        word-wrap: break-word;
        line-height: 1.3;
        font-size: 14px;
      }
      .result-box {
        padding: 10px;
        background: #e3f2fd;
        border-radius: 5px;
        word-break: break-all;
        margin: 12px 0;
        line-height: 1.3;
        font-size: 14px;
      }
      .btn {
        padding: 8px 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-right: 8px;
      }
      .btn:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>签名计算工具</h2>

      <div class="info-box">
        <label>密钥（来自 URL 参数 sk）：</label>
        <div id="secretKey"></div>
      </div>

      <div class="form-item">
        <label>开始日期：</label>
        <input type="date" id="startDate" />
      </div>

      <div class="form-item">
        <label>结束日期：</label>
        <input type="date" id="endDate" />
      </div>

      <div class="form-item">
        <label>设备码：</label>
        <input type="text" id="deviceId" placeholder="请输入设备码" />
      </div>

      <button class="btn" onclick="calculate()">计算签名</button>
      <button class="btn" onclick="copyResult()">复制结果</button>

      <div class="result-box">
        <strong>最终签名结果：</strong><br />
        <span id="result"></span>
      </div>
    </div>

    <script>
      // 页面加载时自动初始化
      window.onload = function () {
        // 从 URL 获取密钥
        const params = new URLSearchParams(window.location.search);
        const secretKey = params.get("sk") || "";
        document.getElementById("secretKey").innerText = secretKey;

        const startTime = new Date();
        const endTime = new Date();
        endTime.setFullYear(startTime.getFullYear() + 1);

        document.getElementById("startDate").value = formatLocalDate(startTime);
        document.getElementById("endDate").value = formatLocalDate(endTime);
      };

      function formatLocalDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function dateToDays(dateStr) {
        const d = new Date(dateStr);
        const base = new Date("1995-04-20");
        return Math.floor((d - base) / 86400000);
      }

      function writeUint24(buffer, offset, value) {
        buffer[offset] = value & 0xff;
        buffer[offset + 1] = (value >> 8) & 0xff;
        buffer[offset + 2] = (value >> 16) & 0xff;
      }

      function packBinary(startDays, days, secretKey, deviceHash) {
        const payload = startDays + "|" + days + "|" + deviceHash;
        const hmac = CryptoJS.HmacMD5(payload, secretKey);
        const hmacBytes = CryptoJS.enc.Hex.parse(hmac.toString()).words.flatMap(
          (w) => [
            (w >>> 24) & 0xff,
            (w >>> 16) & 0xff,
            (w >>> 8) & 0xff,
            w & 0xff,
          ],
        );

        const buffer = new Uint8Array(22);
        buffer.set(hmacBytes, 0);
        writeUint24(buffer, 16, startDays);
        writeUint24(buffer, 19, days);

        return buffer;
      }

      function calculate() {
        const secretKey = document.getElementById("secretKey").innerText.trim();
        const startDate = document.getElementById("startDate").value.trim();
        const endDate = document.getElementById("endDate").value.trim();
        const deviceId = document.getElementById("deviceId").value.trim();

        if (!secretKey || !startDate || !endDate || !deviceId) {
          alert("请填写完整信息");
          return false;
        }

        const startDays = dateToDays(startDate);
        const days = dateToDays(endDate) - startDays;

        const binary = packBinary(startDays, days, secretKey, deviceId);
        const result = uint8ArrayToBase58(binary);

        document.getElementById("result").innerText = result;
        return true;
      }

      var BASE58_ALPHABET =
        "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

      function uint8ArrayToBase58(bytes) {
        var n = 0n;
        for (var i = 0; i < bytes.length; i++) n = n * 256n + BigInt(bytes[i]);
        var s = "";
        while (n > 0n) {
          s = BASE58_ALPHABET[Number(n % 58n)] + s;
          n /= 58n;
        }
        for (var i = 0; i < bytes.length && bytes[i] === 0; i++) s = "1" + s;
        return s;
      }

      // 复制结果：没计算则自动先计算
      function copyResult() {
        const success = calculate();
        if (!success) return;

        let res = document.getElementById("result").innerText;
        navigator.clipboard
          .writeText(res)
          .then(() => {
            alert("复制成功！");
          })
          .catch(() => {
            alert("复制失败，请手动复制");
          });
      }
    </script>
  </body>
</html>
